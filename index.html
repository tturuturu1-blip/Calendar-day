<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mobile Calendar</title>
    <!-- Подключаем шрифт -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Подключаем библиотеку для шифрования данных -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
    <!-- Путь к стилям -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="app-container">
        
        <!-- ==================== ЭКРАН 1: МЕСЯЦ ==================== -->
        <section id="monthView" class="view active">
            <header class="app-header">
                <div class="month-selector">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg>
                    <span id="monthTitle">Ноябрь</span>
                </div>
                <div class="header-icons">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path><path d="M13.73 21a2 2 0 0 1-3.46 0"></path></svg>
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                </div>
            </header>

            <div class="weekdays">
                <div>Пн</div><div>Вт</div><div>Ср</div><div>Чт</div><div>Пт</div><div class="weekend">Сб</div><div class="weekend">Вс</div>
            </div>
            
            <div class="days-grid" id="daysGrid">
                <!-- Дни генерируются через JS -->
            </div>

            <!-- Нижняя панель с расписанием на выбранный день -->
            <div class="agenda-section">
                <div class="agenda-header">
                    <div>
                        <span class="today-label">СЕГОДНЯ</span>
                        <div class="date-large" id="selectedDateLarge">25</div>
                    </div>
                    <div class="agenda-summary">
                        <span id="eventSummary">0 событий</span>
                        <button class="view-all-btn" id="goToDayBtn">Все</button>
                    </div>
                </div>
                <div class="agenda-list" id="agendaList">
                    <!-- Список событий на выбранный день -->
                </div>
            </div>
        </section>

        <!-- ==================== ЭКРАН 2: РАСПИСАНИЕ ДНЯ (ТАЙМЛАЙН) ==================== -->
        <section id="dayView" class="view">
            <header class="app-header day-header">
                <button class="back-btn" id="backBtn">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"></polyline></svg>
                </button>
                <div class="day-title">
                    <h2 id="dayTitle">25 Февраля</h2>
                    <span id="daySub">Понедельник</span>
                </div>
                <div class="day-nav">
                    <button id="prevDayBtn">‹</button>
                    <button id="nextDayBtn">›</button>
                </div>
            </header>

            <div class="timeline-wrapper" id="timelineWrapper">
                <!-- Таймлайн генерируется через JS -->
            </div>
        </section>

        <!-- Плавающая кнопка добавления -->
        <button class="fab" id="addBtn">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
        </button>

    </div>

    <!-- Модальное окно -->
    <div class="modal-overlay" id="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>Новое событие</h3>
                <button id="closeModalBtn">&times;</button>
            </div>
            <form id="eventForm">
                <div class="input-group">
                    <label>Название</label>
                    <input type="text" id="evTitle" required placeholder="Например: Встреча">
                </div>
                <div class="input-row">
                    <div class="input-group">
                        <label>Дата</label>
                        <input type="date" id="evDate" required>
                    </div>
                    <div class="input-group">
                        <label>Время</label>
                        <input type="time" id="evTime" required>
                    </div>
                </div>
                <div class="input-group">
                    <label>Описание</label>
                    <textarea id="evDesc" placeholder="Детали события..."></textarea>
                </div>
                <button type="submit" class="submit-btn">Сохранить</button>
            </form>
        </div>
    </div>

    <!-- Путь к скриптам -->
    <script src="js/app.js"></script>
</body>
</html>
